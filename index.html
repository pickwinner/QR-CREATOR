<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Simple QR Generator</title>
<style>
body {
    background: #0d1117;
    font-family: Arial, sans-serif;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.container {
    background: #161b22;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0px 0px 20px #000;
    width: 350px;
    text-align: center;
}
input {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: none;
    margin-bottom: 10px;
}
button {
    width: 100%;
    padding: 12px;
    background: #00c2cb;
    border: none;
    font-weight: bold;
    cursor: pointer;
    border-radius: 6px;
}
#qrcode {
    margin-top: 20px;
    background: #fff;
    padding: 15px;
    display: inline-block;
}
</style>
</head>
<body>
<div class="container">
    <h2>QR Code Generator</h2>
    <input type="text" id="urlInput" placeholder="Paste your link here">
    <button onclick="generateQR()">Generate QR</button>

    <div id="qrcode"></div>
    <button id="downloadBtn" style="margin-top: 15px; display:none;" onclick="downloadQR()">
        Download QR
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
function generateQR() {
    const url = document.getElementById("urlInput").value.trim();
    if (!url) {
        alert("Please enter a link!");
        return;
    }

    let qrContainer = document.getElementById("qrcode");
    qrContainer.innerHTML = ""; // Clear previous QR

    QRCode.toCanvas(
        url,
        { width: 250, color: { dark: "#000000", light: "#ffffff" } },
        function(err, canvas) {
            if (err) console.error(err);
            else {
                qrContainer.appendChild(canvas);
                document.getElementById("downloadBtn").style.display = "block";
            }
        }
    );
}

function downloadQR() {
    const canvas = document.querySelector("#qrcode canvas");
    let link = document.createElement("a");
    link.download = "qr-code.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
}
</script>

</body>
</html>
